name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The module floor and the current release. The floor is what the
        # go.mod directive promises; stable is what contributors actually
        # run, and a generator that only works on one of them is broken.
        go: ["1.24", "stable"]
    name: go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # The root module has no go.sum — that is the zero-dependency
          # invariant, not an oversight — so point the cache at the module
          # that does have dependencies.
          cache-dependency-path: conformance/go.sum

      # The SDK's whole dependency story is that the root module has none.
      # Asserting it here means a stray `go get` cannot land unnoticed.
      - name: Root module has zero dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "::error file=go.mod::the root module must have no dependencies"
            grep -n '^require' -A 20 go.mod
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The conformance module is separate, so the root's ./... does not
      # reach it. Running it explicitly is not optional: a change to the
      # ucpgen CLI surface once broke its drift guard, and nothing noticed
      # until the goldens were regenerated by hand.
      - name: Conformance (separate module)
        working-directory: conformance
        run: |
          go vet ./...
          go test ./...

      # A short fuzz run on top of the seeded corpus. It is a smoke test,
      # not a search: the seeds already run under `go test`, and this only
      # gives the fuzzer enough time to find something the table-driven
      # cases would not have reached.
      - name: Fuzz agreement (30s)
        if: matrix.go == 'stable'
        working-directory: conformance
        run: go test -run '^$' -fuzz=FuzzValidateAgreement -fuzztime=30s ./...
